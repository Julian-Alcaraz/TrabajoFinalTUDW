  <div class="card-header">Talleres cargados</div>
  <div class="card-body">

    <!--  -->
    <div class="scroll mt-4">
      <table mat-table [dataSource]="talleres" class="mat-elevation-z8 table-auto scroll" matSort (matSortChange)="announceSortChange($event)">
        <!-- # -->
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element">{{ talleres.data.indexOf(element) + 1 }}</td>
        </ng-container>
        <!-- Nombre -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>
        <!-- fecha -->
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por fecha">Fecha</th>
          <td mat-cell *matCellDef="let element">{{ element.fecha }}</td>
        </ng-container>
        <!-- duracion -->
        <ng-container matColumnDef="duracion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por duracion">Duración</th>
          <td mat-cell *matCellDef="let element">{{ element.duracion + ' horas' }}</td>
        </ng-container>
        <!-- frecuencia -->
        <ng-container matColumnDef="frecuencia">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por frecuencia">Frecuencia</th>
          <td mat-cell *matCellDef="let element">{{ element.frecuencia }}</td>
        </ng-container>
        <!-- destinatarios -->
        <ng-container matColumnDef="destinatarios">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por destinatarios">Destinatarios</th>
          <td mat-cell *matCellDef="let element">{{ element.destinatarios }}</td>
        </ng-container>
        <!-- turno -->
        <!-- conjuntoCon -->
        <!-- id_institucion -->
        <!-- id_curso -->
        <!-- id_especialidad -->
        <!-- id_marco -->
        <!-- observaciones -->

        <!-- Habilitado -->
        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por estado">Estado</th>
          <td mat-cell *matCellDef="let element">
            <p-tag [severity]="element.deshabilitado ? 'danger' : 'success'" [value]="element.deshabilitado ? 'Deshabilitado' : 'Habilitado'" />
          </td>
        </ng-container>
        <!-- Accion -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Acción</th>
          <td mat-cell *matCellDef="let element">
            <div class="flex flex-row gap-2">
              <button [pTooltip]="element.deshabilitado ? 'Habilitar' : 'Deshabilitar'" tooltipPosition="top" [attr.aria-label]="element.deshabilitado ? 'Botón de habilitar taller' : 'Botón de deshabilitar taller'" (click)="element.deshabilitado ? habilitar(element.id) : inhabilitar(element.id); $event.stopPropagation()" [class]="element.deshabilitado ? 'text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-2 py-1 text-center -700 -800 disabled:bg-gray-400' : 'text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-2 py-1 text-center -700 -800 disabled:bg-gray-400'">
                @if (element.deshabilitado) {
                  <i class="fa-solid fa-check"></i>
                } @else {
                  <i class="fa-solid fa-xmark fa-lg"></i>
                }
              </button>
              <button [pTooltip]="'Editar'" tooltipPosition="top" aria-label="Botón de editar taller" (click)="element.deshabilitado ? notificar(element.id) : editarTaller(element.id); $event.stopPropagation()" class="'text-white bg-sky-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-2 py-1 text-center -700 -800 disabled:bg-gray-400'">
                <i class="fa-solid fa-pencil" style="color: #ffffff"></i>
              </button>
            </div>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr [pTooltip]="'Ver taller'" tooltipPosition="top" mat-row *matRowDef="let row; columns: displayedColumns" (click)="!row.deshabilitado ? verDetallesTaller(row.id) : notificar(row.id)" class="cursor-pointer hover:bg-gray-300"></tr>
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center font-bold text-blue-800 text-xl" [attr.colspan]="displayedColumns.length">
            @if (searching) {
              <div class="flex justify-center items-center h-32">
                <app-loading />
              </div>
            } @else {
              <!-- <p class="py-5">{{ mensajes }}</p> -->
            }
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator [length]="resultsLength" [pageSize]="10" [pageSizeOptions]="[10, 15, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
