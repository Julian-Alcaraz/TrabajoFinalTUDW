<div class="p-2">
  <app-year-grado-form (cambioForm)="cambioForm($event)" />
</div>

<div class="grid sm:grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4">
  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloAnteojos" [subTitulo]="subTitulo + cursoLabel" [labels]="['Si', 'No']" [set]="{ label: '', data: countAnteojos }" />
  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloDemanda" [subTitulo]="subTitulo + cursoLabel" [labels]="arrayDemanda" [set]="{ label: '', data: countDemanda }" />

  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md"><app-bar-graph [loading]="loading" [titulo]="tituloAnteojos" [subTitulo]="cursoLabel" [porcentaje]="porcentaje === 1" [labels]="['Si', 'No']" [sets]="porcentajeAnteojos" /></div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md"><app-bar-graph [loading]="loading" [titulo]="tituloDemanda" [subTitulo]="cursoLabel" [porcentaje]="porcentaje === 1" [labels]="['Control niño sano', 'Docente', 'Familiar', 'Otro']" [sets]="porcentajeDemanda" /></div>
</div>
