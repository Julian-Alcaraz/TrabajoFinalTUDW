<div class="p-2">
  <app-year-grado-form (cambioForm)="cambioForm($event)" />
</div>

<app-grid-changer (gridChange)="setearGrid($event)"></app-grid-changer>
<div
  [ngClass]="{
    'grid gap-4 ': true,
    'grid-cols-1  sm:mx-12 ': grid === 1,
    'grid-cols-2  ': grid === 2,
    'grid-cols-3  ': grid === 3,
  }"
>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-pie-graph [loading]="loading" [titulo]="tituloAnteojos" [subTitulo]="subTitulo + cursoLabel" [labels]="['Si', 'No']" [set]="{ label: '', data: countAnteojos }" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-pie-graph [loading]="loading" [titulo]="tituloDemanda" [subTitulo]="subTitulo + cursoLabel" [labels]="arrayDemanda" [set]="{ label: '', data: countDemanda }" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloAnteojos" [subTitulo]="cursoLabel" [porcentaje]="porcentaje === 1" [labels]="['Si', 'No']" [sets]="porcentajeAnteojos" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloDemanda" [subTitulo]="cursoLabel" [porcentaje]="porcentaje === 1" [labels]="['Control niño sano', 'Docente', 'Familiar', 'Otro']" [sets]="porcentajeDemanda" />
  </div>
</div>
