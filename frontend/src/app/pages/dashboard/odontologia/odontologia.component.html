<div class="p-2">
  <app-year-grado-form (cambioForm)="cambioForm($event)" />
</div>

<app-grid-changer (gridChange)="setearGrid($event)"></app-grid-changer>
<div
  [ngClass]="{
    'grid gap-4 ': true,
    'grid-cols-1  sm:mx-12 ': grid === 1,
    'grid-cols-2  ': grid === 2,
    'grid-cols-3  ': grid === 3,
  }"
>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloCepillado" [subTitulo]="cursoInstitucionLabel" [porcentaje]="porcentaje === 1" [labels]="labelVeces" [sets]="porcentajesCepillado" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloSituacionBucal" [subTitulo]="cursoInstitucionLabel" [porcentaje]="porcentaje === 1" [labels]="situacionBucales" [sets]="porcentajesSituacionBucal" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloTopificacion" [subTitulo]="cursoInstitucionLabel" [porcentaje]="porcentaje === 1" [labels]="['Si', 'No']" [sets]="porcentajesTopificacion" />
  </div>
  <div class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md">
    <app-expand-compress-button [grid]="grid" (actualizarGraficos)="actualizarGraficos()"></app-expand-compress-button>
    <app-bar-graph [loading]="loading" [titulo]="tituloSellador" [subTitulo]="cursoInstitucionLabel" [porcentaje]="porcentaje === 1" [labels]="['Si', 'No']" [sets]="porcentajesSellador" />
  </div>

  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloCepillado" [subTitulo]="subTitulo" [labels]="labelVeces" [set]="{ label: '', data: countCepillado }" />
  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloSituacionBucal" [subTitulo]="subTitulo" [labels]="situacionBucales" [set]="{ label: '', data: countSituacionBucal }" />
  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloTopificacion" [subTitulo]="subTitulo" [labels]="['Si', 'No']" [set]="{ label: '', data: countTopificacion }" />
  <app-pie-graph class="border sm:p-4 z-2 bg-gray-100 rounded-lg shadow-md" [loading]="loading" [titulo]="tituloSellador" [subTitulo]="subTitulo" [labels]="['Si', 'No']" [set]="{ label: '', data: countSellador }" />
</div>
