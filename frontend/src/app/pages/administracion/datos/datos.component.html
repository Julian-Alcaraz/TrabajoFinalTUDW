<div class="card">
  <div class="card-header">
    <span>Importar archivos</span>
  </div>
  <div class="card-body">
    <h2>Cargue el archivo de consultas que desee</h2>
    <div>
      <app-input-file idInput="clinica" [control]="clinicaFileControl" label="Clinica" />
      <button class="py-1 m-2 px-2 rounded bg-blue-600 disabled:bg-gray-400" [disabled]="clinicaFileControl.errors">Cargar</button>
    </div>
    <hr />
    <div>
      <app-input-file idInput="odontologia" [control]="odontologiaFileControl" label="Odontologia" />
      <button class=" py-1 m-2 px-2 rounded bg-blue-600 disabled:bg-gray-400" [disabled]="odontologiaFileControl.errors">Cargar</button>
    </div>
    <hr />
    <div>
      <app-input-file idInput="fonoaudiologia" [control]="fonoaudiologiaFileControl" label="Fonoaudiologia" />
      <button class=" py-1 m-2 px-2 rounded bg-blue-600 disabled:bg-gray-400" [disabled]="fonoaudiologiaFileControl.errors">Cargar</button>
    </div>
    <hr />
    <div>
      <app-input-file idInput="oftalmologia" [control]="oftalmologiaFileControl" label="Oftalmologia" />
      <button class=" py-1 m-2 px-2 rounded bg-blue-600 disabled:bg-gray-400" [disabled]="oftalmologiaFileControl.errors">Cargar</button>
    </div>
    <!-- <hr />
    <div>
      <app-input-file idInput="adicciones" [control]="adiccionFileControl" label="Adicciones" />
      <button class=" py-1 m-2 px-2 rounded bg-blue-600 disabled:bg-gray-400" [disabled]="adiccionFileControl.errors">Cargar</button>
    </div> -->
  </div>
</div>
