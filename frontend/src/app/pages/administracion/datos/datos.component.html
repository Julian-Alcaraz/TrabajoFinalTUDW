<div class="card">
  <div class="card-header">
    <span>Importar archivos</span>
  </div>
  <div class="card-body">
    <h2 class="fs-10">Cargue el archivo de consultas que desee</h2>
    <app-select-file [loading]="loading" [control]="clinicaFileControl" [type]="'Clinica'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-select-file [loading]="loading" [control]="odontologiaFileControl" [type]="'Odontologia'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-select-file [loading]="loading" [control]="fonoaudiologiaFileControl" [type]="'Fonoaudiologia'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-select-file [loading]="loading" [control]="oftalmologiaFileControl" [type]="'Oftalmologia'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-select-file [control]="prevencionFileControl" [type]="'Prevencion'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-select-file [loading]="loading" [control]="socialFileControl" [type]="'Social'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
    <hr />
    <app-input-select-enum label="Tipo de taller" [control]="controlDeInput('tipoTaller')" idInput="tipoTaller" [opciones]="opcionesTipoTaller" [valores]="opcionesTipoTaller"/>

    <!-- <app-input-select label="Tipo de taller" [control]="controlDeInput('tipoTaller')" idInput="tipoTaller" [opciones]="opcionesTipoTaller" (change)="onChangeInstitucion()" /> -->
    <hr />
    <app-select-file [loading]="loading" [control]="talleresFileControl" [type]="'Talleres'" (cargarArchivo)="cargarArchivo($event)" (fileSelected)="onFileSelected($event)" />
  </div>
</div>
