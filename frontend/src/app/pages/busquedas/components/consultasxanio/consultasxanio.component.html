<form [formGroup]="buscarForm" (ngSubmit)="submit()" class="flex items-center space-x-2">
  <p-iftalabel class="my-4">
    <!-- SACAR ngModel, ESTA DEPRECADO!!!!!!!!! -->
    <p-datepicker [(ngModel)]="date" idInput="year" view="year" dateFormat="yy" [maxDate]="maxDate" formControlName="year" styleClass="h-16" />
    <label for="year">Año</label>
  </p-iftalabel>
  <button type="submit" [disabled]="!this.buscarForm.valid" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-3 py-2 text-center disabled:bg-gray-400">Buscar</button>
</form>
@if (searching) {
  <app-loading />
}
