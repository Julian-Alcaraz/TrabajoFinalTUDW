<div class="card">
  <app-tabs [tabs]="['Año', 'Personalizada']" (positionEmitter)="escucharParam($event)"></app-tabs>
  <div class="card-body">
    <div class="mb-2">
      @if (currentParam === 0 || !currentParam) {
        <app-consultasxanio />
      }
      @if (currentParam === 1) {
        <app-personalizada />
      }
    </div>
    @if (busco) {
      <app-consultas-table [displayedColumns]="['numero', 'type', 'fecha', 'nombre', 'documento', 'profesional', 'observaciones']" />
    }
  </div>
</div>
